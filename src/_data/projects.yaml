- id: circuits
  section: research
  cat: RL · Mechanistic interpretability · Control
  title: Circuit Isolation and Control of MuJoCo Agents
  meta: Independent · Sep 2026 – present
  summary:
    - Find out what causal role the live neurons in a trained agent play, then use that to steer a frozen agent from the outside. The pipeline goes from circuit discovery in the base agent, to a clamp interface, to a goal-conditioned controller. I'm now porting it to a MuJoCo body to see whether “macro” commands like walk, stand or raise a limb can be issued to a fine-motor base policy.
  details:
    label: Early results
    paras:
      - In the pilot, masking in the coordinate basis beat masking through a sparse autoencoder by a wide margin (a drop of +0.7 against −27.0). The SAE's reconstruction noise dominated the effect.
  status: Active · in progress

- id: vlm-rda
  section: research
  cat: RL · Reward design · Vision-language models
  title: "VLM-RDA: Multimodal Reward Design Agent"
  meta: Independent · Aug 2026 – present
  summary:
    - Text-only reward-design agents like Eureka only see numbers, so they miss reward hacking you can only see. This pipeline feeds evaluation videos straight to a vision-language model, which can spot failures like “zombie dragging” and rewrite the reward code.
  details:
    label: How it works
    paras:
      - <em>Dual-scale anchoring.</em> The VLM sees the custom reward scale and the true environment scale side by side, so it doesn't drift into reward-hacked optima.
      - <em>Memory and rollback.</em> A bipartite memory maps visual anomalies to specific reward-code variables, and an elitism rule rolls back to the last stable reward when training diverges.
      - <em>Backend.</em> A custom PyTorch Conservative Reliable Policy Iteration (CRPI) implementation alongside stable-baselines3 PPO, SAC and TD3, with Optuna sweeps and SLURM deployment.
  status: Active · in progress

- id: dormant
  section: research
  cat: RL · Network plasticity
  title: Dormant Neurons in RL
  url: https://github.com/Peddinti-Sriram-Bharadwaj/dormat_RL
  meta: Independent · Aug 2026 – present
  summary:
    - Tracks post-ReLU units that go permanently quiet in DQN agents and recycles them (ReDo). Zero-Interference Routing (ZIR) then zeroes the weights from recycled neurons into a frozen high-activity sub-network, so repurposing them for a new task can't interfere with the old one. A zero-padding wrapper lets one fixed network move between environments, from CartPole to Acrobot.
    - Checked with 5-seed ablations and multi-head controls, then scaled up to LunarLander, to separate ZIR's effect from random masking and shared-head interference.
  status: Active · in progress
  links:
    - { label: Code, url: "https://github.com/Peddinti-Sriram-Bharadwaj/dormat_RL" }

- id: controlnet-car
  section: earlier
  cat: Diffusion · ControlNet
  title: "Generative Automotive Design: Structural Disentanglement"
  meta: Nov – Dec 2025
  summary:
    - A domain-specific ControlNet that separates a car's geometry from its paint and texture, so it can be “resprayed” without the model pulling it back toward a generic sedan. Dropping the text prompt 70% of the time forced the model to rely on edge features, producing a “structural locking” effect visible in what I called the Ghost Car phenomenon.

- id: mosaic
  section: earlier
  cat: Diffusion · Layout control
  title: Semantic Layout Control & Mosaic ControlNet
  meta: Nov – Dec 2025
  summary:
    - Conditioning ControlNet on COCO layouts, with a failure analysis of “concept bleeding” in nested bounding boxes. Mosaic Control is a colour-guidance scheme that abstracts the ground-truth image, keeping spatial correspondence while removing the semantic conflict. Trained on WikiArt within 15 GB of VRAM.

- id: executorch
  section: engineering
  cat: Open source · PyTorch / ExecuTorch
  title: Vulkan Backend Build Fixes
  meta: Dec 2025 – Jan 2026
  summary:
    - Fixed Ninja build failures in ExecuTorch's Vulkan backend (#16354, #14984) by restructuring <code>ShaderLibrary.cmake</code> to drop wildcard dependencies that custom commands don't support. Verified with a clean cross-compile for Android arm64-v8a and a MobileNetV2 run on a real device.

- id: rag
  section: engineering
  cat: On-device AI · Android
  title: Offline RAG Assistant on Gemini Nano
  meta: Kotlin · AICore · SQLite · Sep 2026 – present
  summary:
    - A fully offline six-stage retrieval pipeline on Gemini Nano with an on-device Gecko embedder. It fuses dense and BM25 search, adds HyDE and System 2 Attention filtering, and skips generation entirely when retrieval confidence is too low.
  part:
    label: Found along the way
    text: a poisoned document could be retrieved as the top chunk and hijack the answer. A pre-filter and prompt hardening blocked all of the injected chunks on-device.

- id: voice
  section: engineering
  cat: On-device AI · Android · GPU
  title: Offline Voice Assistant with llama.cpp and whisper.cpp
  meta: C++ · JNI · Vulkan · Sep 2026
  summary:
    - Microphone to LLM to speech, fully offline. Custom JNI bridges bring llama.cpp (Qwen2.5-1.5B) and whisper.cpp natively into a Kotlin app, with token streaming across the JNI boundary.
  part:
    label: The interesting bug
    text: quantised models gave silently wrong output on the Tensor G5's PowerVR GPU. I traced it to the Vulkan cooperative-matrix and integer-dot-product extensions, and shipped a runtime workaround that restored correct GPU offload.


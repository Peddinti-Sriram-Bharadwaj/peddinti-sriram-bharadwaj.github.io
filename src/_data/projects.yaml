- id: collusion
  section: research
  cat: Multi-agent · AI safety · Interpretability
  title: "Tacit Collusion in Pricing Agents: Robustness, Detection, and a Mechanistic Probe of a Pricing LLM"
  url: https://apartresearch.com/sprints/projects/tacit-collusion-in-pricing-agents-robustness-detection-and-a-mechanistic-probe-of-a-pricing-llm-qxsb
  meta: Apart Research AI Collusion Research Sprint · Oct 2026 · team “Code Compels”, with Chewon Cho and Gagana MD
  summary:
    - We let AI agents set prices in a simulated market and asked two questions. Can collusion be broken without more oversight? And is a pricing LLM's reaction to a rival real strategic reasoning?
  details:
    label: Results and limits
    paras:
      - <em>Breaking collusion.</em> A single agent that refuses to follow high prices pulls the market back down. This works for a simple rule-based learner, and more strongly for an LLM pricing on its own.
      - <em>Inside the model.</em> Steering the model's internal representation moves its own price, so the reaction has a physical trace. But a deviation test showed no punishment: the model cut its price about as much after a rival raised prices as after a rival undercut it.
      - <em>Limits.</em> The steering direction overlaps with a generic “price” direction, which we report openly. This is an early-stage sprint project, not a peer-reviewed publication.
  status: Completed · report and code public
  links:
    - { label: Report, url: "https://apartresearch.com/sprints/projects/tacit-collusion-in-pricing-agents-robustness-detection-and-a-mechanistic-probe-of-a-pricing-llm-qxsb" }
    - { label: Code, url: "https://github.com/Peddinti-Sriram-Bharadwaj/Collusion" }
  home:
    title: Tacit Collusion in Pricing Agents
    cat: Multi-agent · AI safety
    meta: Apart Research sprint · Oct 2026 · with Chewon Cho and Gagana MD
    summary: One agent that refuses to follow high prices is enough to pull a colluding market back down. High AI prices alone aren't proof of collusion.

- id: sor
  section: research
  cat: RL theory · Numerical linear algebra
  title: "The SOR Family: A Navigable Continuum of Bellman Training Signals"
  meta: <b>Sriram Bharadwaj</b>, Raghuram Bharadwaj (IIIT Bangalore), Shalabh Bhatnagar (IISc) · Stochastic Systems Lab, IISc · 2026
  summary:
    - Successive Over-Relaxation, applied to the Bellman target, gives a continuum of temporal-difference update rules controlled by one relaxation factor ω. Standard and accelerated TD targets fall out as special cases, and it costs nothing extra to add to a Deep Q-Network.
  details:
    label: Results
    paras:
      - "Up to 65% better performance on Atari environments with Bayesian-optimised ω, and LunarLander-v3 solved in under 160 episodes, with statistical significance checked. The family also carries over to tree search: a TD-SOR variant of AlphaZero applies the relaxed targets to self-play value learning."
  part:
    label: My part
    text: co-developed the update rules; built the orchestration that ran parallel hyperparameter sweeps across 6+ GPUs, and the Optuna/SQLite auditing that measures how ω affects gradient stability, sample complexity and seed robustness; implemented the AlphaZero variant in JAX.
  status: Manuscript under review
  home:
    title: The SOR Family of Bellman Updates
    cat: RL theory
    meta: IISc Stochastic Systems Lab · 2026 · under review
    summary: A single relaxation factor ω that unifies TD-learning update rules. Up to 65% better on Atari. With Raghuram Bharadwaj and Shalabh Bhatnagar.

- id: ubu
  section: research
  cat: RL theory · AI safety · Measure theory
  title: "UBU: Unmeasurability-Based Unlearning for Safe Reinforcement Learning"
  url: /assets/papers/ubu-unlearning-safe-rl.pdf
  meta: <b>Sriram Bharadwaj</b>, Raghuram Bharadwaj · IIIT Bangalore · Oct 2025, revised Aug 2026
  summary:
    - "Unlearning in RL often hides information rather than erasing it. If an attacker can query a policy on a well-chosen “generating collection” of state–action pairs, Carathéodory's extension theorem says the whole policy is pinned down. We model the attack as a supermartingale over the query history and show reconstruction succeeds almost surely. The defence is to make forbidden states <em>unmeasurable</em>: a sparse mixture-of-experts encoder maps safe states onto a low-dimensional manifold, and forbidden states fall off it."
  details:
    label: Results and limits
    paras:
      - In a 2D reconstruction attack, the adversary recovers the forbidden region with IoU above 0.95 against a standard value network, and below 0.05 against the defended one. On a 50-dimensional Swiss roll, the encoder cleanly excises a forbidden band.
      - <em>Limits.</em> Both experiments are controlled proofs of concept. Real encoders are continuous, so the separation is only approximate, and an adversary who learns the manifold geometry is still an open problem.
  status: Report · not peer-reviewed
  links:
    - { label: PDF, url: /assets/papers/ubu-unlearning-safe-rl.pdf }
  home:
    title: "UBU: Unmeasurability-Based Unlearning"
    cat: RL theory · AI safety
    meta: IIIT Bangalore · 2026 · report
    summary: If a policy can measure a forbidden state, an attacker can reconstruct it. So make forbidden states unmeasurable.

